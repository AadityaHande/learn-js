<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-body-secondary">
<div class="container mt-5">

    <!-- Start, Pause, Lap, Reset Buttons -->
    <div class="row mb-3">
        <div class="col d-flex justify-content-center">
            <button id="startBtn" class="btn btn-success me-2">Start</button>
            <button id="pauseBtn" class="btn btn-warning me-2" disabled>Pause</button>
            <button id="lapBtn" class="btn btn-primary me-2" disabled>Lap</button>
            <button id="resetBtn" class="btn btn-danger">Reset</button>
        </div>
    </div>

    <!-- Time Display -->
    <div class="row mb-4">
        <div class="col text-center">
            <h1 id="display" class="display-4 fw-bold">00:00:00.00</h1>
        </div>
    </div>

    <!-- Lap List -->
    <div class="row">
        <div class="col-md-6 mx-auto">
            <ul id="lapList" class="list-group"></ul>
        </div>
    </div>

</div>
<script src="script.js"></script>
</body>
</html>
