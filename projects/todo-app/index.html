<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-body-secondary">
<div class="container mt-5">
    <div class="card shadow-sm mx-auto" style="max-width:550px;">
        <div class="card-body">
            <h2 class="text-center mb-4">To-Do List</h2>
            <!-- Input -->
            <form id="todoForm" class="input-group mb-3">
                <input type="text" id="todoInput" class="form-control" placeholder="What needs to be done?" autocomplete="off">
                <button class="btn btn-primary" type="submit"> Add </button>
            </form>

            <!-- Filters -->
            <div class="d-flex justify-content-center gap-2 mb-3">
                <button class="btn btn-primary filter-btn active" data-filter="all"> All </button>
                <button class="btn btn-outline-primary filter-btn" data-filter="active"> Active </button>
                <button class="btn btn-outline-primary filter-btn" data-filter="completed"> Completed </button>
            </div>

            <!-- Todo List -->
            <ul id="todoList" class="list-group mb-3"></ul>

            <!-- Footer -->
            <div class="d-flex justify-content-between align-items-center">
                <span id="itemsLeft" class="text-muted"> 0 items left </span>
                <button id="clearCompletedBtn" class="btn btn-outline-danger btn-sm"> Clear Completed </button>
            </div>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
